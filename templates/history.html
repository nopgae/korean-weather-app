<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ city }} — Weather History</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f7; padding: 2rem 1rem; color: #2d3748; }
    .wrap { max-width: 900px; margin: 0 auto; background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    h1 { font-size: 1.6rem; margin: 0 0 0.3rem; }
    a { color: #3182ce; }
    .muted { color: #718096; font-size: 0.9rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/">← All cities</a>
    <h1>{{ city }} temperature history</h1>
    <p class="muted">{{ history|length }} readings from the database (saved at most every 10 min when the dashboard is opened)</p>
    {% if history %}
      <canvas id="chart"></canvas>
    {% else %}
      <p>No readings yet — open the dashboard to record one.</p>
    {% endif %}
  </div>
  <script>
    const h = {{ history|tojson }};
    if (h.length) new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels: h.map(r => new Date(r.recorded_at).toLocaleString("ko-KR", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"})),
        datasets: [
          {label: "Temperature (°C)", data: h.map(r => r.temperature), borderColor: "#3182ce", yAxisID: "t"},
          {label: "Humidity (%)", data: h.map(r => r.humidity), borderColor: "#a0aec0", yAxisID: "h"},
        ],
      },
      options: {scales: {t: {position: "left"}, h: {position: "right", grid: {drawOnChartArea: false}}}},
    });
  </script>
</body>
</html>
